# Production: PostgreSQL + UzSL API + Caddy (automatic HTTPS for API_DOMAIN)
#   cd backend/deploy && docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: uzsl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: uzsl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzsl -d uzsl"]
      interval: 5s
      retries: 10

  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://uzsl:${POSTGRES_PASSWORD}@db:5432/uzsl
      MEDIA_DIR: /data/media
      FCM_CREDENTIALS_FILE: /run/secrets/firebase-key.json
    volumes:
      # Uploaded videos and images survive restarts and new versions
      - media:/data/media
      - ./firebase-key.json:/run/secrets/firebase-key.json:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
