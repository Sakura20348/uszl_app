[project]
name = "backend"
version = "0.1.0"
description = "Backend API for the SignLang app"
readme = "README.md"
authors = [
    { name = "Botirali Jalolov", email = "botirali.jalolov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "google-auth>=2.59.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv]
package = false
